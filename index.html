<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> جاوب أسرع </title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="islamic-pattern"></div>

    <div class="container">
        <!-- الشاشة الرئيسية -->
        <div class="screen active" id="homeScreen">
            <div class="card">
                <div class="moon"></div>
                <h1>تحدي رمضان</h1>
                <p class="subtitle">اختبر معلوماتك الدينية في أجواء رمضانية </p>
                <button class="btn btn-primary" onclick="goToPlayers()">🌙 ابدأ اللعبة</button>
            </div>
        </div>

        <!-- شاشة إدخال الأسماء -->
        <div class="screen" id="playersScreen">
            <div class="card players-card">
                <div class="players-header">
                    <div class="players-icon">👥</div>
                    <h2>أسماء اللاعبين</h2>
                    <p class="players-subtitle">أضف من لاعب واحد إلى ما تشاء</p>
                </div>
                <div class="add-player-row">
                    <input type="text" id="playerInput" placeholder="اكتب اسم اللاعب..." onkeypress="if(event.key==='Enter') addPlayer()">
                    <button class="add-btn" onclick="addPlayer()">
                        <span class="add-btn-icon">+</span>
                        <span>إضافة</span>
                    </button>
                </div>
                <div class="players-list" id="playersList"></div>
                <button class="btn btn-primary continue-btn" onclick="goToDifficulty()" id="continueBtn" style="display: none;">
                    متابعة ←
                </button>
            </div>
        </div>

        <!-- شاشة اختيار المستوى -->
        <div class="screen" id="difficultyScreen">
            <div class="card">
                <h2>اختر مستوى الصعوبة</h2>
                <div class="difficulty-options">
                    <button class="difficulty-btn" onclick="selectDifficulty('easy')">😊<br>سهل</button>
                    <button class="difficulty-btn" onclick="selectDifficulty('medium')">🤔<br>متوسط</button>
                    <button class="difficulty-btn" onclick="selectDifficulty('hard')">🔥<br>صعب</button>
                </div>
                <button class="btn btn-primary" onclick="startGame()" id="startGameBtn" style="display: none;">ابدأ الأسئلة</button>
                <button class="btn btn-secondary" onclick="goBackToPlayers()">رجوع لإضافة لاعبين</button>
            </div>
        </div>

        <!-- شاشة الأسئلة -->
        <div class="screen" id="questionScreen">
            <!-- هيدر -->
            <div class="question-header">
                <button class="btn-back" onclick="goBackToHome()">
                    <span class="btn-back-icon">🏠</span>
                    <span class="btn-back-text">الرئيسية</span>
                </button>
                <div class="question-counter" id="questionCounter"></div>
                <div class="timer-inline">
                    <svg class="timer-ring" viewBox="0 0 60 60">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#f7c548;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="timer-ring-bg" cx="30" cy="30" r="25"></circle>
                        <circle class="timer-ring-progress" cx="30" cy="30" r="25"
                                stroke-dasharray="157.08" stroke-dashoffset="0"
                                id="timerCircle"></circle>
                    </svg>
                    <span class="timer-num" id="timerText">30</span>
                </div>
            </div>

            <!-- كارد السؤال -->
            <div class="card question-card">
                <div class="question-text" id="questionText"></div>
            </div>

            <!-- خيارات الإجابة -->
            <div class="options-grid" id="optionsGrid"></div>

            <!-- نتيجة الإجابة -->
            <div class="answer-result" id="answerResult" style="display:none;">
                <div class="answer-result-inner" id="answerResultInner"></div>
            </div>

            <!-- اختيار اللاعب -->
            <div class="player-selection-card" id="playerSelection" style="display: none;">
                <h3>من أجاب أولاً؟</h3>
                <div class="player-grid" id="playerGrid"></div>
            </div>

            <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" style="display: none;">السؤال التالي ←</button>
        </div>

        <!-- شاشة النتائج -->
        <div class="screen" id="resultsScreen">
            <div class="card">
                <div class="winner-animation">
                    <div class="winner-crown">👑</div>
                    <h2>الفائز</h2>
                    <div class="winner-name" id="winnerName"></div>
                    <p class="subtitle" id="winnerScore"></p>
                </div>
                <div class="scoreboard">
                    <h3 style="text-align: center; color: var(--secondary); margin-bottom: 20px;">لوحة النتائج</h3>
                    <div id="finalScores"></div>
                </div>
                <button class="btn btn-primary" onclick="restartGame()">العب مرة أخرى</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
<footer class="footer">2026 HOPE ©</footer>
</html>
